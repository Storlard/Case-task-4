<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Калькулятор</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="calculator">

            <h1>Калькулятор</h1>

            <input id="num1" type="text" placeholder="Введите первое число">
            <input id="num2" type="text" placeholder="Введите второе число">

            <div class="buttons">
                <button onclick="sum()">Сумма</button>
                <button onclick="subtract()">Разность</button>
                <button onclick="multiply()">Произведение</button>
                <button onclick="divide()">Деление</button>
            </div>

            <div class="result" id="result">
                Результат появится здесь
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
